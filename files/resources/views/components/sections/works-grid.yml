# The visual editor's contract for sections/works-grid.blade.php.
title: Work grid
description: A mono section label over two columns of large project cards with hover ticker pills, fed by the works collection
fields:
    label:
        type: text
        label: Section label
        default: "Selected works"
    works:
        type: repeater
        label: Projects
        item_label: title
        add_button_label: Add project
        sub_fields:
            title:
                type: text
                label: Title
            year:
                type: text
                label: Year
            category:
                type: text
                label: Category
            image:
                type: image
                label: Card image
            imageAlt:
                type: text
                label: Image alt text
            link:
                type: url
                label: Link
